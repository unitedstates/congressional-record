
[project]
name = 'congressionalrecord'
version = "2.3.0"
description = 'Parse the U.S. Congressional Record from GovInfo.'
authors = [
    { name="Nick Judd", email="nick@nclarkjudd.com" },
]
readme = "README.md"
requires-python = ">= 3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]
dependencies = [
    'beautifulsoup4',
    'lxml',  # the parser's BeautifulSoup tree builder
    'urllib3',
    'certifi',
    'pydantic >= 2',  # congressionalrecord.schema uses the v2 API
    ]
keywords = ["unitedstates", "open government data", "congress", "legislative data"]
license = "BSD-3-Clause"

[project.optional-dependencies]
dev = ["pre-commit", "pip-tools"]
# The `pg` mode's flat-file writer and the pg_config table scripts.
postgres = ["psycopg2-binary", "SQLAlchemy", "PyYAML", "unicodecsv"]

[project.urls]
Homepage='https://github.com/unitedstates/congressional-record'
Issues='https://github.com/unitestates/congressional-record/issues'

[project.scripts]
congressionalrecord = "congressionalrecord.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["congressionalrecord"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
